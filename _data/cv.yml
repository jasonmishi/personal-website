        summary: Developed full-stack network automation tools at open source first company specializing in network security. Built and maintained FullCtl peering management and network automation tools. Contributed to maintaining PeeringDB open source project. Led frontend development initially with legacy vanilla JS library and then later migration effort to Vue.js. Did backend work with Python and Django.
        highlights:
          - Introduced the use of Vue.js instead of an inhouse vanilla JS framework.
          - Took over and maintained a project for a internet exchange standards organization that was previously developed by another company when there was no experience within the company for the technology stack used.
          - OpenSource contributions to PeeringDB
          - Overhaul of UI for fullctl
          - Developed and help deploy many documentation and client websites using fully automated CI/CD
      - company: Innodata Inc. (Innodata Lanka)
        position: Software Engineer
        url: "https://innodata.com/"
        start_date: 2020-04-01
        end_date: 2022-02-01
        summary: Was hired in some of the company's first outsourcing software development projects. Initially in a data engineering/web scraping project and then assigned as the only frontend engineer in a project to develop a WYSIWYG custom XML editor for one the largest standards organizations. This product has become a key part of the company's product line.
        highlights:
          - POC for a serverless containerized web scraping solution using AWS Lambda and Docker.
          - Developed and designed a custom WYSIWYG XML editor with custom formats and plugins for a large standards organization.
